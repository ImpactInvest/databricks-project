name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests app
      - name: Format check
        run: ruff format --check src tests app
      - name: Unit tests (no Databricks calls)
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -q

  spark-tests:
    # PySpark transforms and every golden-set reference query on synthetic data (local Spark).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt pyspark==4.2.0
      - name: Spark tests
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -q tests/test_pipeline_spark.py
